{{define "back"}}
<!DOCTYPE html>
<html>
<head>
<title>Anki</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<base href="/media/{{.Deck}}/">
<style>
/* Layout tested empirically against the Kobo webview (2026-08): nested
   overflow:auto containers (table-cell or div with a constrained height)
   did NOT scroll reliably in this browser - drag never worked, and
   programmatic scrollTop was flaky even where the page rendered fine.
   What DID work: the plain, whole-document scroll with header/footer as
   position:fixed overlays and body padding to keep content clear of
   them. That's what this template uses now. If this browser's zoom
   slider turns out to desync position:fixed from the visual viewport,
   that has NOT been reproduced in our testing so far - re-verify on
   device before reverting this, don't take that claim on faith. */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin:0; padding:0; background-color:#fff; color:#000; }
body {
  padding-top: 60px;   /* = header height below */
  padding-bottom: 120px; /* = footer height below */
}
a { text-decoration:none; color:#000; }

header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  background-color: #eee;
}
header a {
  display: table;
  width: 100%;
  height: 100%;
}
header a span {
  display: table-cell;
  text-align: center;
  vertical-align: middle;
  font-size: 18px;
}

#content {
  padding: 12px;
}

footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 120px;
  display: table;
  table-layout: fixed;
  width: 100%;
}
footer a {
  display: table-cell;
  width: 25%;
  height: 120px;
  text-align: center;
  vertical-align: middle;
}
footer a span { font-size: 18px; font-weight: bold; }
footer a.again { background-color: #ddd; }
footer a.hard  { background-color: #ccc; }
footer a.good  { background-color: #bbb; }
footer a.easy  { background-color: #aaa; }

/* .card-face is the one sizing hook markdown and html/apkg cards share -
   see wrapCardFace in cmd/server/main.go. font-size/font-weight give
   markdown content (which carries no styling of its own) the same look
   the old per-template <font size="7"><b> used to; an html/apkg card's own
   CSS below can override either for its own content. */
.card-face { display: block; font-size: 16px; font-weight: bold; zoom: {{.CardScale}}; }
{{if .BackCardCSS}}{{.BackCardCSS}}{{end}}
{{if .GlobalCardCSS}}{{.GlobalCardCSS}}{{end}}
.card-face img { max-width: 100%; max-height: 50%; }
</style>
</head>
<body>

<header>
<a href="/"><span>[decks]</span></a>
</header>

<div id="content">
{{if not .IsHTML}}
<font size="5" color="#666666">{{.FrontHeadwordHTML}}</font>
<br><br>
{{end}}
{{.BackHTML}}
</div>

<footer>
<a class="again" href="/rate?front={{.Key}}&deck={{.Deck}}&q=1&reverse={{if .Reverse}}1{{else}}0{{end}}"><span>Again</span></a>
<a class="hard"  href="/rate?front={{.Key}}&deck={{.Deck}}&q=2&reverse={{if .Reverse}}1{{else}}0{{end}}"><span>Hard</span></a>
<a class="good"  href="/rate?front={{.Key}}&deck={{.Deck}}&q=3&reverse={{if .Reverse}}1{{else}}0{{end}}"><span>Good</span></a>
<a class="easy"  href="/rate?front={{.Key}}&deck={{.Deck}}&q=4&reverse={{if .Reverse}}1{{else}}0{{end}}"><span>Easy</span></a>
</footer>

<script>
// Tap anywhere on the page to page down by one screenful. Whole-document
// scroll (see layout comment above) - not a scrollTop increment on a
// nested container, since that's the part that didn't work reliably.
// header/footer heights read at runtime rather than hardcoded, so this
// doesn't silently break if the CSS heights above ever change.
//
// The listener is on document, not #content: #content's box is only as
// tall as the card, so a short card leaves blank space between it and the
// fixed footer that a #content-only listener would never see taps in. A
// document-level listener catches the whole viewport; header/footer
// clicks are explicitly excluded so their own links keep working
// untouched.
(function () {
	var content = document.getElementById('content');
	var header = document.querySelector('header');
	var footer = document.querySelector('footer');
	if (!content || !header || !footer) { return; }

	// A spacer below the real content, sized generously to one viewport
	// height, so the browser's own native scroll limit never clips the
	// final tap short: without it, a card whose remaining content is
	// shorter than one screenful gets clamped, and the last jump ends up
	// smaller than every other one. Added once and left alone - its own
	// exact size doesn't matter (it only needs to be at least one
	// screenful), so it doesn't need to track images still loading.
	var spacer = document.createElement('div');
	spacer.style.height = window.innerHeight + 'px';
	document.body.appendChild(spacer);

	document.addEventListener('click', function (e) {
		if (header.contains(e.target) || footer.contains(e.target)) { return; } // own links

		var headerHeight = header.getBoundingClientRect().height;
		var footerHeight = footer.getBoundingClientRect().height;
		var visibleHeight = window.innerHeight - headerHeight - footerHeight;

		// Measured fresh off #content itself (not document.scrollHeight,
		// which now includes the spacer) so a still-loading image that
		// grows the card after the page first rendered is picked up
		// correctly, instead of freezing a stale value at load time.
		var scrollY = window.pageYOffset || document.documentElement.scrollTop;
		var contentBottom = content.getBoundingClientRect().bottom + scrollY;
		var realMaxScroll = contentBottom + footerHeight - window.innerHeight;
		if (realMaxScroll <= 0) { return; } // nothing to scroll

		if (scrollY >= realMaxScroll - 1) {
			// Already showing the last page: no-op, stay put (rating
			// buttons are the way forward from here, not another tap).
			return;
		}
		window.scrollTo(0, scrollY + visibleHeight);
	}, false);
})();
</script>

</body>
</html>
{{end}}
