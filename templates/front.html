{{define "front"}}
<!DOCTYPE html>
<html>
<head>
<title>Anki</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<base href="/media/{{.Deck}}/">
<style>
/* See back.html for why this is plain whole-document scroll with the
   header as a position:fixed overlay, rather than a nested overflow:auto
   container. */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin:0; padding:0; background-color:#fff; color:#000; }
body {
  padding-top: 60px; /* = header height below */
}
a { text-decoration:none; color:#000; }

header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  background-color: #eee;
  display: table;
  table-layout: fixed;
  width: 100%;
}
header a {
  display: table-cell;
  width: 50%;
  height: 60px;
  text-align: center;
  vertical-align: middle;
}
header a span { font-size: 18px; }

#content {
  padding: 12px;
}

/* .card-face is the one sizing hook markdown and html/apkg cards share -
   see wrapCardFace in cmd/server/main.go. font-size/font-weight give
   markdown content (which carries no styling of its own) the same look
   the old per-template <font size="7"><b> used to; an html/apkg card's own
   CSS below can override either for its own content. */
.card-face { display: block; font-size: 16px; font-weight: bold; zoom: {{.CardScale}}; }
{{if .FrontCardCSS}}{{.FrontCardCSS}}{{end}}
{{if .GlobalCardCSS}}{{.GlobalCardCSS}}{{end}}
.card-face img { max-width: 100%; max-height: 50%; }
</style>
</head>
<body>

<header>
<a href="/"><span>[decks]</span></a>
<a href="/study?deck={{.Deck}}&reverse={{if .Reverse}}0{{else}}1{{end}}"><span>{{if .Reverse}}[normal]{{else}}[reverse]{{end}}</span></a>
</header>

<div id="content">
{{.FrontHTML}}
<br><br><br>
<font size="4" color="#666666">[tap to show answer]</font>
</div>

<script>
// #content is a plain div, not a link - wrapping block-level card content
// (font/br/images) in an <a> made this browser split it into multiple,
// independently-clickable regions instead of one, so tap-to-scroll and
// tap-to-reveal ended up colliding. Navigation is done by hand instead,
// from the same click handler that does the paging, exactly like
// back.html's tap-to-scroll - just with a location.href instead of a
// no-op once there's nothing left to page through.
//
// The listener is on document, not #content: #content's box is only as
// tall as the card, so a short card leaves blank space below it (down to
// the header) that a #content-only listener would never see taps in. A
// document-level listener catches the whole viewport; header clicks are
// explicitly excluded so its own links keep working untouched.
(function () {
	var content = document.getElementById('content');
	var header = document.querySelector('header');
	if (!content || !header) { return; }

	var backHref = "/back?front={{.Key}}&deck={{.Deck}}&reverse={{if .Reverse}}1{{else}}0{{end}}";

	// See back.html for why this spacer exists: it just needs to be at
	// least one screenful so the browser's own native scroll limit never
	// clips the final tap short.
	var spacer = document.createElement('div');
	spacer.style.height = window.innerHeight + 'px';
	document.body.appendChild(spacer);

	document.addEventListener('click', function (e) {
		if (header.contains(e.target)) { return; } // header has its own links

		var headerHeight = header.getBoundingClientRect().height;
		var visibleHeight = window.innerHeight - headerHeight;

		// Measured fresh off #content itself (not document.scrollHeight,
		// which now includes the spacer) so a still-loading image that
		// grows the card after the page first rendered is picked up
		// correctly, instead of freezing a stale value at load time.
		var scrollY = window.pageYOffset || document.documentElement.scrollTop;
		var contentBottom = content.getBoundingClientRect().bottom + scrollY;
		var realMaxScroll = contentBottom - window.innerHeight;

		if (realMaxScroll <= 0 || scrollY >= realMaxScroll - 1) {
			// Nothing left to page through: show the answer.
			window.location.href = backHref;
			return;
		}
		window.scrollTo(0, scrollY + visibleHeight);
	}, false);
})();
</script>

</body>
</html>
{{end}}
